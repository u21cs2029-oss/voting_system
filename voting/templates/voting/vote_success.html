<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Successful</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px 35px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .success-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease;
        }
        
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        h1 {
            color: #28a745;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .info-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            border-left: 4px solid #28a745;
        }
        
        .info-label {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .info-value {
            color: #333;
            font-size: 1.15em;
            font-weight: 700;
            margin-bottom: 12px;
        }
        
        .thank-you {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
            margin: 20px 0;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }
        
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .btn-logout {
            background: #dc3545;
            color: white;
        }
        
        .btn-logout:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.3);
        }
        
        @media (max-width: 600px) {
            .container { padding: 30px 25px; }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Vote Recorded!</h1>
        
        <div class="info-box">
            <div class="info-label">Your Vote For</div>
            <div class="info-value">{{ candidate.name }}</div>
            
            <div class="info-label">Party</div>
            <div class="info-value">{{ candidate.party }}</div>
            
            <div class="info-label">Constituency</div>
            <div class="info-value">{{ constituency }}</div>
        </div>
        
        <p class="thank-you">
            Thank you for participating!<br>
            Your vote has been securely recorded.
        </p>
        
        <div class="buttons">
            <a href="{% url 'result' %}" class="btn btn-primary">
                📊 View Results
            </a>
            <a href="{% url 'home' %}" class="btn btn-secondary">
                🏠 Home
            </a>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" style="width: 100%;">
                {% csrf_token %}
                <button type="submit" class="btn btn-logout" style="width: 100%;">
                    🚪 Logout
                </button>
            </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
