<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 35px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 550px;
            width: 100%;
            position: relative;
        }
        
        .admin-link {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 16px;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .admin-link:hover {
            background: #667eea;
            color: white;
        }
        
        .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #888;
            font-size: 0.95em;
            margin-bottom: 20px;
        }
        
        p {
            color: #666;
            font-size: 1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .features {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .feature {
            flex: 1;
            min-width: 140px;
            padding: 15px 10px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .feature-icon {
            font-size: 1.8em;
            margin-bottom: 8px;
        }
        
        .feature-text {
            color: #555;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 35px;
            font-size: 1.05em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }
        
        @media (max-width: 600px) {
            .container { padding: 30px 25px; }
            h1 { font-size: 1.7em; }
            .buttons { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin/" class="admin-link">🔐 Admin</a>
        
        <div class="icon">🗳️</div>
        <h1>Online Voting System</h1>
        <p class="subtitle">Your Voice, Your Choice</p>
        
        <p>Secure, transparent, and democratic elections for everyone.</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">Secure</div>
            </div>
            <div class="feature">
                <div class="feature-icon">✅</div>
                <div class="feature-text">One Vote</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📧</div>
                <div class="feature-text">OTP</div>
            </div>
        </div>
        
        <div class="buttons">
            <a href="{% url 'register' %}" class="btn btn-primary">
                📝 Register
            </a>
            <a href="{% url 'otp_login' %}" class="btn btn-secondary">
                🔑 Login
            </a>
        </div>
    </div>
</body>
</html>
